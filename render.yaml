# Render Blueprint — one Node web service with a persistent SQLite disk.
# Persistent disks require a paid Render web-service plan; the free plan is not durable.
# The browser and API share one origin, so WEB_ORIGINS is not required for normal use.
services:
  - type: web
    name: agripulse
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    # Migrations and the two public demo workspaces are additive/idempotent.
    # They never overwrite an existing non-demo account with a reserved email.
    startCommand: npm run db:setup && node server.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: agripulse-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: AGRIPULSE_DB_PATH
        value: /var/data/agripulse.sqlite
      # Render terminates TLS in front of the Node process.
      - key: TRUST_PROXY
        value: "true"
      # Both gates are intentional for this public, non-admin demo deployment.
      # Set both to false (and rebuild) for a deployment without demo access.
      - key: ALLOW_DEMO_SESSIONS
        value: "true"
      - key: VITE_DEMO_MODE
        value: "true"
